<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify StarryNight Wallpaper</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            position: relative;
            background: #07111c;
        }

        /* =========================================================
           ARKA PLAN
           ========================================================= */

        .glow-background {
            position: fixed;
            inset: 0;

            background:
                radial-gradient(
                    ellipse 75% 65% at 7% 92%,
                    rgba(12, 67, 115, 0.58) 0%,
                    rgba(9, 51, 91, 0.40) 28%,
                    rgba(6, 35, 63, 0.20) 48%,
                    transparent 72%
                ),

                radial-gradient(
                    ellipse 65% 55% at 42% 72%,
                    rgba(15, 49, 80, 0.25) 0%,
                    transparent 70%
                ),

                linear-gradient(
                    180deg,
                    #040b12 0%,
                    #07111b 32%,
                    #091827 70%,
                    #0a1b2b 100%
                );

            z-index: 1;
        }

        .glow-background::after {
            content: "";
            position: absolute;
            inset: 0;

            background:
                radial-gradient(
                    ellipse at 18% 78%,
                    rgba(18, 81, 130, 0.10),
                    transparent 55%
                );

            pointer-events: none;
        }

        /* =========================================================
           YOĞUN ARKA PLAN YILDIZLARI
           ========================================================= */

        #dustCanvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* =========================================================
           SHOOTING STAR
           ========================================================= */

        .star-field {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
        }

        .star-field span {
            position: absolute;

            width: 3px;
            height: 3px;

            background: #fff;
            border-radius: 50%;

            box-shadow:
                0 0 0 3px rgba(255, 255, 255, 0.06),
                0 0 7px rgba(255, 255, 255, 0.85),
                0 0 17px rgba(255, 255, 255, 0.65);

            animation: shootStar linear infinite;
            opacity: 0;
        }

        .star-field span::before {
            content: "";

            position: absolute;
            top: 50%;
            left: 0;

            transform: translateY(-50%);

            width: 280px;
            height: 1px;

            background: linear-gradient(
                90deg,
                rgba(255,255,255,0.85),
                rgba(255,255,255,0.35) 35%,
                rgba(255,255,255,0.08) 75%,
                transparent
            );
        }

        @keyframes shootStar {
            0% {
                transform: rotate(315deg) translateX(0);
                opacity: 0;
            }

            8% {
                opacity: 1;
            }

            65% {
                opacity: 1;
            }

            100% {
                transform: rotate(315deg) translateX(-1250px);
                opacity: 0;
            }
        }

        /* Daha sık shooting star */
        .star-field span:nth-child(1) {
            top: 2%;
            right: 5%;
            animation-delay: 0s;
            animation-duration: 2.2s;
        }

        .star-field span:nth-child(2) {
            top: 8%;
            right: 18%;
            animation-delay: 0.6s;
            animation-duration: 2.8s;
        }

        .star-field span:nth-child(3) {
            top: 16%;
            right: 9%;
            animation-delay: 1.3s;
            animation-duration: 2s;
        }

        .star-field span:nth-child(4) {
            top: 3%;
            right: 34%;
            animation-delay: 1.9s;
            animation-duration: 2.5s;
        }

        .star-field span:nth-child(5) {
            top: 12%;
            right: 48%;
            animation-delay: 2.7s;
            animation-duration: 2.2s;
        }

        .star-field span:nth-child(6) {
            top: 5%;
            right: 63%;
            animation-delay: 3.4s;
            animation-duration: 3s;
        }

        .star-field span:nth-child(7) {
            top: 22%;
            right: 3%;
            animation-delay: 4.1s;
            animation-duration: 2.4s;
        }

        .star-field span:nth-child(8) {
            top: 7%;
            right: 78%;
            animation-delay: 4.8s;
            animation-duration: 2.6s;
        }

        .star-field span:nth-child(9) {
            top: 18%;
            right: 86%;
            animation-delay: 5.5s;
            animation-duration: 2.1s;
        }

        .star-field span:nth-child(10) {
            top: 30%;
            right: 28%;
            animation-delay: 6.2s;
            animation-duration: 2.7s;
        }

        .star-field span:nth-child(11) {
            top: 38%;
            right: 8%;
            animation-delay: 6.8s;
            animation-duration: 2.3s;
        }

        .star-field span:nth-child(12) {
            top: 14%;
            right: 72%;
            animation-delay: 7.4s;
            animation-duration: 3.1s;
        }

        /* =========================================================
           CANVAS YILDIZLARI
           ========================================================= */

        @media (prefers-reduced-motion: reduce) {
            .star-field span {
                animation: none;
                display: none;
            }
        }
    </style>
</head>

<body>

    <div class="glow-background"></div>

    <canvas id="dustCanvas"></canvas>

    <div class="star-field">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <script>
        const canvas = document.getElementById("dustCanvas");
        const ctx = canvas.getContext("2d");

        let particles = [];

        function resizeCanvas() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);

            canvas.width = Math.floor(window.innerWidth * dpr);
            canvas.height = Math.floor(window.innerHeight * dpr);

            canvas.style.width = window.innerWidth + "px";
            canvas.style.height = window.innerHeight + "px";

            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        function initParticles() {
            resizeCanvas();

            const area =
                window.innerWidth * window.innerHeight;

            /*
             * Daha yoğun yıldız:
             * Önceki 11000 -> 6500
             */
            const count = Math.floor(area / 6500);

            particles = Array.from(
                { length: count },
                () => {
                    const sizeRandom = Math.random();

                    return {
                        x: Math.random() * window.innerWidth,
                        y: Math.random() * window.innerHeight,

                        size:
                            sizeRandom < 0.85
                                ? Math.random() * 0.8 + 0.25
                                : Math.random() * 1.5 + 0.6,

                        alpha: Math.random(),

                        speed:
                            Math.random() * 0.008 + 0.0015,

                        phase:
                            Math.random() * Math.PI * 2,

                        glow:
                            Math.random() < 0.18
                    };
                }
            );
        }

        window.addEventListener("resize", initParticles);

        initParticles();

        function draw(time) {
            ctx.clearRect(
                0,
                0,
                window.innerWidth,
                window.innerHeight
            );

            const t = time * 0.001;

            for (const p of particles) {

                /*
                 * Yavaş yıldız kırpışması
                 */
                const pulse =
                    (Math.sin(
                        t * p.speed * 1000 + p.phase
                    ) + 1) / 2;

                const alpha =
                    0.08 + pulse * 0.78;

                /* Ana yıldız */
                ctx.beginPath();

                ctx.arc(
                    p.x,
                    p.y,
                    p.size,
                    0,
                    Math.PI * 2
                );

                ctx.fillStyle =
                    `rgba(255,255,255,${alpha})`;

                ctx.fill();

                /*
                 * Parlak yıldızlarda halo
                 */
                if (p.glow) {

                    const gradient =
                        ctx.createRadialGradient(
                            p.x,
                            p.y,
                            0,
                            p.x,
                            p.y,
                            p.size * 6
                        );

                    gradient.addColorStop(
                        0,
                        `rgba(255,255,255,${alpha * 0.32})`
                    );

                    gradient.addColorStop(
                        0.35,
                        `rgba(210,235,255,${alpha * 0.10})`
                    );

                    gradient.addColorStop(
                        1,
                        "rgba(255,255,255,0)"
                    );

                    ctx.beginPath();

                    ctx.arc(
                        p.x,
                        p.y,
                        p.size * 6,
                        0,
                        Math.PI * 2
                    );

                    ctx.fillStyle = gradient;
                    ctx.fill();
                }
            }

            requestAnimationFrame(draw);
        }

        requestAnimationFrame(draw);
    </script>

</body>
</html>
